<!--
  Painel do editor de video — template que o Claude preenche com dados do inicio.py.
  O Claude substitui {{DATA}} por um JSON com: marca, setup, videos[], padroes[].
  Mostrado via show_widget na abertura de sessao.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --hdr: #1a1a1a;
    --hdr-sub: #a0a0a0;
    --accent: #e8590c;
    --accent-soft: rgba(232,89,12,0.08);
    --accent-text: #c44b0a;
    --card: #ffffff;
    --card-border: #f0f0f0;
    --bg: #f7f7f5;
    --txt: #1a1a1a;
    --txt2: #6b6b6b;
    --txt3: #999;
    --ok: #1a7f37;
    --ok-bg: rgba(26,127,55,0.07);
    --warn: #bf6a02;
    --warn-bg: rgba(191,106,2,0.07);
    --blue: #0969da;
    --blue-bg: rgba(9,105,218,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --hdr: #f0f0f0;
      --hdr-sub: #888;
      --accent: #f27a3a;
      --accent-soft: rgba(242,122,58,0.12);
      --accent-text: #f27a3a;
      --card: #1e1e1e;
      --card-border: #2a2a2a;
      --bg: #141414;
      --txt: #e8e8e8;
      --txt2: #999;
      --txt3: #666;
      --ok: #3fb950;
      --ok-bg: rgba(63,185,80,0.1);
      --warn: #d29922;
      --warn-bg: rgba(210,153,34,0.1);
      --blue: #58a6ff;
      --blue-bg: rgba(88,166,255,0.1);
    }
  }
  :root[data-theme="dark"] {
    --hdr: #f0f0f0;
    --hdr-sub: #888;
    --accent: #f27a3a;
    --accent-soft: rgba(242,122,58,0.12);
    --accent-text: #f27a3a;
    --card: #1e1e1e;
    --card-border: #2a2a2a;
    --bg: #141414;
    --txt: #e8e8e8;
    --txt2: #999;
    --txt3: #666;
    --ok: #3fb950;
    --ok-bg: rgba(63,185,80,0.1);
    --warn: #d29922;
    --warn-bg: rgba(210,153,34,0.1);
    --blue: #58a6ff;
    --blue-bg: rgba(88,166,255,0.1);
  }

  .app { font-family: 'Inter', -apple-system, sans-serif; color: var(--txt); padding: 0; }

  .hero { padding: 28px 24px 24px; margin: 0 -16px; background: var(--bg); border-radius: 16px; margin-bottom: 20px; }
  .hero-row { display: flex; align-items: flex-start; justify-content: space-between; }
  .hero h1 { font-size: 26px; font-weight: 600; color: var(--hdr); letter-spacing: -0.5px; line-height: 1.2; }
  .hero-desc { font-size: 14px; color: var(--txt2); margin-top: 6px; line-height: 1.5; max-width: 420px; }
  .badge { font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 100px; white-space: nowrap; }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }

  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .num-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px 18px; }
  .num-val { font-size: 36px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
  .num-val-blue { color: var(--blue); }
  .num-val-warn { color: var(--warn); }
  .num-val-ok { color: var(--ok); }
  .num-lbl { font-size: 13px; color: var(--txt3); margin-top: 6px; font-weight: 400; }

  .label { font-size: 13px; font-weight: 600; color: var(--txt2); margin-bottom: 12px; letter-spacing: 0.02em; }

  .vids { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .vid { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px 20px; cursor: pointer; transition: border-color 0.15s; }
  .vid:hover { border-color: var(--accent); }
  .vid-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .vid-dot-novo { background: var(--blue); }
  .vid-dot-wip { background: var(--warn); }
  .vid-dot-done { background: var(--ok); }
  .vid-body { flex: 1; min-width: 0; }
  .vid-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
  .vid-sub { font-size: 13px; color: var(--txt3); margin-top: 2px; }
  .vid-tag { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 100px; }
  .vid-tag-novo { background: var(--blue-bg); color: var(--blue); }
  .vid-tag-plano, .vid-tag-storyboard, .vid-tag-montagem, .vid-tag-preview { background: var(--warn-bg); color: var(--warn); }
  .vid-tag-entregue { background: var(--ok-bg); color: var(--ok); }
  .vid-arrow { color: var(--txt3); font-size: 18px; }

  .empty-box { text-align: center; padding: 40px 24px; color: var(--txt3); font-size: 14px; background: var(--card); border: 1px dashed var(--card-border); border-radius: 14px; margin-bottom: 28px; line-height: 1.6; }
  .empty-box i { font-size: 32px; display: block; margin-bottom: 12px; opacity: 0.4; }

  .act-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .act-main { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; letter-spacing: -0.1px; transition: opacity 0.12s; }
  .act-main:hover { opacity: 0.9; }
  .act-main i { font-size: 19px; }
  .act-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .act-sec { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card); color: var(--txt); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: border-color 0.15s; }
  .act-sec:hover { border-color: var(--accent); }
  .act-sec i { font-size: 17px; color: var(--txt2); }

  .adj-box { margin-bottom: 8px; }
  .adj-row { display: flex; gap: 8px; }
  .adj-input { flex: 1; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card); color: var(--txt); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  .adj-input::placeholder { color: var(--txt3); }
  .adj-input:focus { border-color: var(--accent); }
  .adj-send { width: 48px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.12s; }
  .adj-send:hover { opacity: 0.9; }

  .foot { text-align: center; font-size: 12px; color: var(--txt3); margin-top: 20px; }
</style>

<div class="app">
  <div class="hero" id="hero"></div>
  <div class="nums" id="nums"></div>
  <div id="vids-sec"></div>
  <div class="label">Acoes</div>
  <div class="act-grid" id="acts"></div>
  <div class="adj-box" id="adj-box" style="display:none">
    <div class="label">Pedir ajuste</div>
    <div class="adj-row">
      <input class="adj-input" id="adj-in" placeholder="Ex.: legenda maior, tira zoom no segundo 12...">
      <button class="adj-send" onclick="enviarAjuste()" aria-label="Enviar"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = {{DATA}};

const DOTS = { novo:'vid-dot-novo', plano:'vid-dot-wip', storyboard:'vid-dot-wip', montagem:'vid-dot-wip', preview:'vid-dot-wip', entregue:'vid-dot-done' };

function render() {
  const { marca, setup, videos = [], padroes = [] } = DATA;
  const n = videos.filter(v => v.etapa === 'novo').length;
  const w = videos.filter(v => !['novo','entregue'].includes(v.etapa)).length;
  const d = videos.filter(v => v.etapa === 'entregue').length;

  document.getElementById('hero').innerHTML = `
    <div class="hero-row">
      <div>
        <h1>${marca || 'Editor de video'}</h1>
        <p class="hero-desc">Seus videos em um lugar so. Suba o bruto no Drive, edite com um clique e receba o video pronto.</p>
      </div>
      <span class="badge ${setup ? 'badge-ok' : 'badge-warn'}">${setup ? 'Configurado' : 'Setup pendente'}</span>
    </div>`;

  document.getElementById('nums').innerHTML = `
    <div class="num-card"><div class="num-val num-val-blue">${n}</div><div class="num-lbl">Novos</div></div>
    <div class="num-card"><div class="num-val num-val-warn">${w}</div><div class="num-lbl">Em andamento</div></div>
    <div class="num-card"><div class="num-val num-val-ok">${d}</div><div class="num-lbl">Entregues</div></div>`;

  const sec = document.getElementById('vids-sec');
  if (!videos.length) {
    sec.innerHTML = '<div class="empty-box"><i class="ti ti-upload" aria-hidden="true"></i>Nenhum video ainda.<br>Suba um video em <strong>brutos/</strong> no seu Drive.</div>';
  } else {
    sec.innerHTML = '<div class="label">Videos</div><div class="vids">' + videos.map(v => {
      const cmd = v.etapa === 'entregue' || v.etapa === 'novo'
        ? `/video-editor-editar ${v.bruto}` : `Continue editando ${v.bruto}`;
      const mb = v.tamanho_mb >= 1000 ? (v.tamanho_mb/1000).toFixed(1)+' GB' : Math.round(v.tamanho_mb)+' MB';
      const pad = v.padrao ? ' · '+v.padrao : '';
      return `<div class="vid" onclick="sendPrompt('${cmd.replace(/'/g,"\\'")}')">
        <div class="vid-dot ${DOTS[v.etapa]||'vid-dot-novo'}"></div>
        <div class="vid-body"><div class="vid-name">${v.bruto}</div><div class="vid-sub">${mb}${pad}</div></div>
        <span class="vid-tag vid-tag-${v.etapa}">${v.etapa}</span>
        <i class="ti ti-chevron-right vid-arrow" aria-hidden="true"></i>
      </div>`;
    }).join('') + '</div>';
  }

  const hp = videos.some(v => v.etapa === 'preview');
  if (hp) document.getElementById('adj-box').style.display = 'block';

  let html = '';
  if (!setup) {
    html = `<button class="act-main" onclick="sendPrompt('/video-editor-configurar')"><i class="ti ti-settings" aria-hidden="true"></i>Configurar</button>`;
  } else {
    if (n > 0) {
      html += `<button class="act-main" onclick="sendPrompt('/video-editor-editar')"><i class="ti ti-edit" aria-hidden="true"></i>Editar video</button>`;
    }
    html += '<div class="act-row">';
    html += `<button class="act-sec" onclick="sendPrompt('/video-editor-videos')"><i class="ti ti-list" aria-hidden="true"></i>Ver videos</button>`;
    if (hp) {
      html += `<button class="act-sec" onclick="sendPrompt('Mostrar o preview do video em andamento')"><i class="ti ti-player-play" aria-hidden="true"></i>Ver preview</button>`;
      html += `<button class="act-sec" onclick="sendPrompt('/video-editor-entregar')"><i class="ti ti-send-2" aria-hidden="true"></i>Entregar</button>`;
    }
    if (!n && !hp) {
      html += `<button class="act-sec" onclick="sendPrompt('/video-editor-editar')"><i class="ti ti-edit" aria-hidden="true"></i>Editar video</button>`;
    }
    html += `<button class="act-sec" onclick="sendPrompt('/video-editor-novo-padrao')"><i class="ti ti-palette" aria-hidden="true"></i>Novo padrao</button>`;
    html += '</div>';
  }
  document.getElementById('acts').innerHTML = html;
  document.getElementById('foot').textContent = padroes.length ? 'Padroes disponiveis: ' + padroes.join(', ') : '';
}

function enviarAjuste() {
  const i = document.getElementById('adj-in');
  const t = i.value.trim();
  if (!t) return;
  sendPrompt('Ajustar: ' + t);
  i.value = '';
}
document.getElementById('adj-in').addEventListener('keydown', e => { if (e.key === 'Enter') enviarAjuste(); });
render();
</script>
