<!--
  Painel do editor de video — template.
  O Claude substitui {{DATA}} por JSON: {marca, setup, videos[], padroes[]}.
  Aberto no browser pane do Claude Code.
-->
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --hdr: #1a1a1a;
    --accent: #e8590c;
    --accent-soft: rgba(232,89,12,0.08);
    --accent-text: #c44b0a;
    --card: #ffffff;
    --card-border: #f0f0f0;
    --bg: #f7f7f5;
    --txt: #1a1a1a;
    --txt2: #6b6b6b;
    --txt3: #999;
    --ok: #1a7f37;
    --ok-bg: rgba(26,127,55,0.07);
    --warn: #bf6a02;
    --warn-bg: rgba(191,106,2,0.07);
    --blue: #0969da;
    --blue-bg: rgba(9,105,218,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --hdr: #f0f0f0;
      --accent: #f27a3a;
      --accent-soft: rgba(242,122,58,0.12);
      --accent-text: #f27a3a;
      --card: #1e1e1e;
      --card-border: #2a2a2a;
      --bg: #141414;
      --txt: #e8e8e8;
      --txt2: #999;
      --txt3: #666;
      --ok: #3fb950;
      --ok-bg: rgba(63,185,80,0.1);
      --warn: #d29922;
      --warn-bg: rgba(210,153,34,0.1);
      --blue: #58a6ff;
      --blue-bg: rgba(88,166,255,0.1);
    }
  }
  :root[data-theme="dark"] {
    --hdr: #f0f0f0;
    --accent: #f27a3a;
    --accent-soft: rgba(242,122,58,0.12);
    --accent-text: #f27a3a;
    --card: #1e1e1e;
    --card-border: #2a2a2a;
    --bg: #141414;
    --txt: #e8e8e8;
    --txt2: #999;
    --txt3: #666;
    --ok: #3fb950;
    --ok-bg: rgba(63,185,80,0.1);
    --warn: #d29922;
    --warn-bg: rgba(210,153,34,0.1);
    --blue: #58a6ff;
    --blue-bg: rgba(88,166,255,0.1);
  }

  body { background: transparent; }
  .app { font-family: 'Inter', -apple-system, sans-serif; color: var(--txt); padding: 0; }

  .hero { padding: 28px 24px 24px; background: var(--bg); border-radius: 16px; margin-bottom: 20px; }
  .hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .hero h1 { font-size: 26px; font-weight: 600; color: var(--hdr); letter-spacing: -0.5px; line-height: 1.2; }
  .hero-desc { font-size: 14px; color: var(--txt2); margin-top: 6px; line-height: 1.5; max-width: 420px; }
  .badge { font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 100px; white-space: nowrap; }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }

  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .num-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px 18px; }
  .num-val { font-size: 36px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
  .num-val-blue { color: var(--blue); }
  .num-val-warn { color: var(--warn); }
  .num-val-ok { color: var(--ok); }
  .num-lbl { font-size: 13px; color: var(--txt3); margin-top: 6px; }

  .refresh-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
  .refresh-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--card); color: var(--txt2); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .refresh-btn i { font-size: 16px; }

  .phase { margin-bottom: 24px; }
  .phase-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .phase-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .phase-dot-blue { background: var(--blue); }
  .phase-dot-warn { background: var(--warn); }
  .phase-dot-ok { background: var(--ok); }
  .phase-title { font-size: 13px; font-weight: 600; color: var(--txt2); letter-spacing: 0.02em; }
  .phase-count { font-size: 12px; color: var(--txt3); }

  .vids { display: flex; flex-direction: column; gap: 8px; }
  .vid { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px 20px; cursor: pointer; transition: border-color 0.15s; }
  .vid:hover { border-color: var(--accent); }
  .vid-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .vid-dot-blue { background: var(--blue); }
  .vid-dot-warn { background: var(--warn); }
  .vid-dot-ok { background: var(--ok); }
  .vid-body { flex: 1; min-width: 0; }
  .vid-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
  .vid-meta { font-size: 13px; color: var(--txt3); margin-top: 2px; }
  .vid-info { font-size: 12px; color: var(--txt2); margin-top: 4px; font-style: italic; }
  .vid-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .vid-tag { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 100px; white-space: nowrap; }
  .vid-tag-novo { background: var(--blue-bg); color: var(--blue); }
  .vid-tag-wip { background: var(--warn-bg); color: var(--warn); }
  .vid-tag-ok { background: var(--ok-bg); color: var(--ok); }
  .vid-arrow { color: var(--txt3); font-size: 18px; }

  .steps { display: flex; align-items: center; gap: 3px; margin-top: 6px; }
  .step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--card-border); }
  .step-dot.done { background: var(--accent); }
  .step-bar { width: 12px; height: 2px; background: var(--card-border); border-radius: 1px; }
  .step-bar.done { background: var(--accent); }
  .step-lbl { font-size: 11px; color: var(--txt3); margin-left: 6px; }

  .empty-box { text-align: center; padding: 40px 24px; color: var(--txt3); font-size: 14px; background: var(--card); border: 1px dashed var(--card-border); border-radius: 14px; margin-bottom: 28px; line-height: 1.6; }
  .empty-icon { font-size: 32px; display: block; margin-bottom: 12px; opacity: 0.4; }

  .act-label { font-size: 13px; font-weight: 600; color: var(--txt2); margin-bottom: 12px; letter-spacing: 0.02em; }
  .act-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .act-main { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.12s; }
  .act-main:hover { opacity: 0.9; }
  .act-main i { font-size: 19px; }
  .act-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .act-sec { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card); color: var(--txt); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: border-color 0.15s; }
  .act-sec:hover { border-color: var(--accent); }
  .act-sec i { font-size: 17px; color: var(--txt2); }

  .adj-box { margin-bottom: 8px; }
  .adj-label { font-size: 13px; font-weight: 600; color: var(--txt2); margin-bottom: 12px; letter-spacing: 0.02em; }
  .adj-row { display: flex; gap: 8px; }
  .adj-input { flex: 1; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card); color: var(--txt); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  .adj-input::placeholder { color: var(--txt3); }
  .adj-input:focus { border-color: var(--accent); }
  .adj-send { width: 48px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.12s; }
  .adj-send:hover { opacity: 0.9; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--hdr); color: var(--bg); padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 100; animation: toastIn 0.2s; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }

  .foot { text-align: center; font-size: 12px; color: var(--txt3); margin-top: 20px; }
</style>

<div class="app">
  <div class="hero" id="hero"></div>
  <div class="nums" id="nums"></div>
  <div class="refresh-bar" id="refresh-bar"></div>
  <div id="sections"></div>
  <div id="acts-sec"></div>
  <div class="adj-box" id="adj-box" style="display:none">
    <div class="adj-label">Pedir ajuste</div>
    <div class="adj-row">
      <input class="adj-input" id="adj-in" placeholder="Ex.: legenda maior, tira zoom no segundo 12...">
      <button class="adj-send" onclick="enviarAjuste()" aria-label="Enviar">&#x2191;</button>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = {{DATA}};

if (typeof sendPrompt === 'undefined') {
  window.sendPrompt = function(text) {
    try { navigator.clipboard.writeText(text); } catch(e) {}
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = 'Comando copiado — cole no chat';
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 2500);
  };
}

var ETAPA = {
  novo:       { label: 'Novo',       desc: 'Pronto pra editar',                group: 'novos',     step: -1 },
  plano:      { label: 'Plano',      desc: 'Plano em construção',    group: 'andamento', step: 0 },
  storyboard: { label: 'Storyboard', desc: 'Storyboard pra aprovar',           group: 'andamento', step: 1 },
  montagem:   { label: 'Montagem',   desc: 'Montando o preview',               group: 'andamento', step: 2 },
  preview:    { label: 'Preview',    desc: 'Preview pronto — ajustar e aprovar', group: 'andamento', step: 3 },
  entregue:   { label: 'Entregue',   desc: '',                                 group: 'entregues', step: -1 }
};
var STEP_NAMES = ['plano', 'storyboard', 'montagem', 'preview'];

function fmtSize(mb) { return mb >= 1000 ? (mb / 1000).toFixed(1) + ' GB' : Math.round(mb) + ' MB'; }

function cmdPara(v) {
  if (v.etapa === 'novo' || v.etapa === 'entregue') return '/video-editor-editar ' + v.bruto;
  if (v.etapa === 'preview') return 'Mostrar o preview de ' + v.bruto;
  return 'Continue editando ' + v.bruto;
}

function stepsHtml(current) {
  var h = '<div class="steps">';
  for (var i = 0; i < 4; i++) {
    if (i > 0) h += '<div class="step-bar' + (i <= current ? ' done' : '') + '"></div>';
    h += '<div class="step-dot' + (i <= current ? ' done' : '') + '" title="' + STEP_NAMES[i] + '"></div>';
  }
  h += '<span class="step-lbl">' + STEP_NAMES[current] + '</span></div>';
  return h;
}

function vidCard(v) {
  var info = ETAPA[v.etapa] || ETAPA.novo;
  var dot = v.etapa === 'entregue' ? 'ok' : v.etapa === 'novo' ? 'blue' : 'warn';
  var tagCls = v.etapa === 'entregue' ? 'ok' : v.etapa === 'novo' ? 'novo' : 'wip';
  var mb = fmtSize(v.tamanho_mb);
  var pad = v.padrao ? ' · ' + v.padrao : '';
  var cmd = cmdPara(v);

  var descLine = '';
  if (v.etapa === 'entregue' && v.saida) {
    descLine = '<div class="vid-info">→ ' + v.saida + '</div>';
  } else if (info.desc) {
    descLine = '<div class="vid-info">' + info.desc + '</div>';
  }

  var progress = '';
  if (info.step >= 0 && info.group === 'andamento') {
    progress = stepsHtml(info.step);
  }

  return '<div class="vid" onclick="sendPrompt(\'' + cmd.replace(/'/g, "\\'") + '\')">'
    + '<div class="vid-dot vid-dot-' + dot + '"></div>'
    + '<div class="vid-body">'
    + '<div class="vid-name">' + v.bruto + '</div>'
    + '<div class="vid-meta">' + mb + pad + '</div>'
    + descLine
    + progress
    + '</div>'
    + '<div class="vid-right">'
    + '<span class="vid-tag vid-tag-' + tagCls + '">' + info.label + '</span>'
    + '<span class="vid-arrow">›</span>'
    + '</div>'
    + '</div>';
}

function section(title, dotColor, videos) {
  if (!videos.length) return '';
  return '<div class="phase">'
    + '<div class="phase-hdr">'
    + '<div class="phase-dot phase-dot-' + dotColor + '"></div>'
    + '<span class="phase-title">' + title + '</span>'
    + '<span class="phase-count">' + videos.length + '</span>'
    + '</div>'
    + '<div class="vids">' + videos.map(vidCard).join('') + '</div>'
    + '</div>';
}

function render() {
  var d = DATA;
  var videos = d.videos || [];
  var novos = videos.filter(function(v) { return v.etapa === 'novo'; });
  var andamento = videos.filter(function(v) { return ['plano','storyboard','montagem','preview'].indexOf(v.etapa) >= 0; });
  var entregues = videos.filter(function(v) { return v.etapa === 'entregue'; });

  andamento.sort(function(a, b) { return (ETAPA[b.etapa].step || 0) - (ETAPA[a.etapa].step || 0); });

  document.getElementById('hero').innerHTML =
    '<div class="hero-row"><div>'
    + '<h1>' + (d.marca || 'Editor de vídeo') + '</h1>'
    + '<p class="hero-desc">Seus vídeos em um lugar só. Suba o bruto no Drive, edite com um clique e receba o vídeo pronto.</p>'
    + '</div>'
    + '<span class="badge ' + (d.setup ? 'badge-ok' : 'badge-warn') + '">' + (d.setup ? 'Configurado' : 'Setup pendente') + '</span>'
    + '</div>';

  document.getElementById('nums').innerHTML =
    '<div class="num-card"><div class="num-val num-val-blue">' + novos.length + '</div><div class="num-lbl">Novos</div></div>'
    + '<div class="num-card"><div class="num-val num-val-warn">' + andamento.length + '</div><div class="num-lbl">Em andamento</div></div>'
    + '<div class="num-card"><div class="num-val num-val-ok">' + entregues.length + '</div><div class="num-lbl">Entregues</div></div>';

  document.getElementById('refresh-bar').innerHTML = d.setup
    ? '<button class="refresh-btn" onclick="sendPrompt(\'/video-editor-verificar\')">↻ Verificar vídeos novos</button>'
    : '';

  var sec = document.getElementById('sections');
  if (!videos.length) {
    sec.innerHTML = '<div class="empty-box"><span class="empty-icon">⇧</span>Nenhum vídeo ainda.<br>Suba um vídeo em <strong>brutos/</strong> no seu Drive.</div>';
  } else {
    sec.innerHTML = section('Novos', 'blue', novos)
      + section('Em andamento', 'warn', andamento)
      + section('Entregues', 'ok', entregues);
  }

  var hasPreview = andamento.some(function(v) { return v.etapa === 'preview'; });
  var actSec = document.getElementById('acts-sec');
  var ah = '<div class="act-label">Ações</div><div class="act-grid">';
  if (!d.setup) {
    ah += '<button class="act-main" onclick="sendPrompt(\'/video-editor-configurar\')">⚙ Configurar</button>';
  } else {
    if (novos.length) {
      ah += '<button class="act-main" onclick="sendPrompt(\'/video-editor-editar\')">✎ Editar vídeo</button>';
    }
    ah += '<div class="act-row">';
    ah += '<button class="act-sec" onclick="sendPrompt(\'/video-editor-videos\')">☰ Ver vídeos</button>';
    if (hasPreview) {
      ah += '<button class="act-sec" onclick="sendPrompt(\'Mostrar o preview do vídeo em andamento\')">▶ Ver preview</button>';
      ah += '<button class="act-sec" onclick="sendPrompt(\'/video-editor-entregar\')">↗ Entregar</button>';
    }
    if (!novos.length && !hasPreview) {
      ah += '<button class="act-sec" onclick="sendPrompt(\'/video-editor-editar\')">✎ Editar vídeo</button>';
    }
    ah += '<button class="act-sec" onclick="sendPrompt(\'/video-editor-novo-padrao\')">◐ Novo padrão</button>';
    ah += '</div>';
  }
  ah += '</div>';
  actSec.innerHTML = ah;

  if (hasPreview) document.getElementById('adj-box').style.display = 'block';
  document.getElementById('foot').textContent = (d.padroes || []).length ? 'Padrões disponíveis: ' + d.padroes.join(', ') : '';
}

function enviarAjuste() {
  var i = document.getElementById('adj-in');
  var t = i.value.trim();
  if (!t) return;
  sendPrompt('Ajustar: ' + t);
  i.value = '';
}

var adjIn = document.getElementById('adj-in');
if (adjIn) adjIn.addEventListener('keydown', function(e) { if (e.key === 'Enter') enviarAjuste(); });
render();
</script>
